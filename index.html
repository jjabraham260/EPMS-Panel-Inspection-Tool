<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPMS Panel Inspection</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#18212b;--muted:#667383;--line:#dde3ea;--brand:#1F4E78;--good:#1e8e4e;--goodbg:#e3f4ea;--bad:#c93a1c;--badbg:#fde8e2;--na:#6b7686;--nabg:#eceff3;--warn:#8a5a00;--warnbg:#fff4d6;--r:12px;--font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:980px;margin:auto}
header h1{margin:0;font-size:18px;font-weight:600}
.sp{flex:1}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.28)}
.overall{max-width:980px;margin:8px auto 0;height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.overall i{display:block;height:100%;background:#7fe3a6;width:0;transition:width .25s}
main{max-width:980px;margin:16px auto 80px;padding:0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600;min-width:84px;text-align:center}
.tab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab.on small{color:#cfe0ef}
.tab.done{border-color:var(--good)}
.tab.flag{border-color:var(--bad)}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 2px 12px}
.ph h2{margin:0;font-size:24px}
.ph span{color:var(--muted)}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
.chip.g{background:var(--goodbg);color:var(--good)}.chip.b{background:var(--badbg);color:var(--bad)}.chip.n{background:var(--nabg);color:var(--na)}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;transition:border-color .15s}
.card.good{border-left-color:var(--good)}.card.bad{border-left-color:var(--bad)}.card.na{border-left-color:var(--na)}
.top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.txt{flex:1 1 320px}
.txt h3{margin:0 0 4px;font-size:18px}
.txt p{margin:0;color:var(--muted);font-size:15px}
.warn{margin-top:8px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:14px}
.btns{display:flex;gap:8px;flex:0 0 auto}
.b{border:2px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;min-width:84px}
.b:hover{background:var(--bg)}
.b.g.on{background:var(--good);border-color:var(--good);color:#fff}
.b.b.on{background:var(--bad);border-color:var(--bad);color:#fff}
.b.n.on{background:var(--na);border-color:var(--na);color:#fff}
textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:15px;resize:vertical;min-height:44px}
textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
textarea.need{border-color:var(--bad);background:#fffaf8}
.hint{font-size:13px;color:var(--bad);margin-top:4px;display:none}
.card.bad.empty .hint{display:block}
.nav{display:flex;gap:10px;justify-content:space-between;margin:18px 0}
.nav button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.nav button.sec{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.nav button:disabled{opacity:.4;cursor:default}
.markall{margin:0 0 4px;font-size:14px}
.markall button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;color:var(--good);font-weight:600}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh h3{margin:0;flex:1}
.db{padding:14px 18px;max-height:62vh;overflow:auto}
.db pre{white-space:pre-wrap;font-family:Consolas,monospace;font-size:13px;background:var(--bg);border-radius:8px;padding:12px;margin:0}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.df button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;font-weight:600}
.df .p{background:var(--brand);color:#fff;border-color:var(--brand)}
.sum td,.sum th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
.sum{border-collapse:collapse;width:100%}
@media print{header,.tabs,.nav,.btns,.markall,.hbtn{display:none}.card{break-inside:avoid}}
</style></head><body>
<header><div class="hrow"><h1>EPMS Panel Inspection</h1><span id="ov" style="font-size:14px;opacity:.9"></span><span class="sp"></span>
<button class="hbtn" id="rep">Summary</button><button class="hbtn" id="rst">Reset all</button></div>
<div class="overall"><i id="bar"></i></div></header>
<main>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<dialog id="dlg"><div class="dh"><h3>Inspection summary</h3><button class="hbtn" style="background:#eef1f5;color:#18212b" id="x">Close</button></div>
<div class="db" id="sumbody"></div>
<div class="df"><button id="cpA">Copy issues only</button><button class="p" id="cpB">Copy full report</button></div></dialog>
<script>
const D={"panels":["D1C1","D1E1","D1E2","D1E3","D1E4","D2C1","D2E1","D2E2","D2E3","D2E4"],"checks":[{"id":"ats","name":"ATS / redundancy modules","desc":"Visually confirm that primary power is on and no alarm is present, and that the alarm switch is enabled."},{"id":"fans","name":"Fans and filters","desc":"Inspect enclosure fans (if installed) from inside and outside for proper operation, obstructions and dust. Check filters (if installed) and clean as needed."},{"id":"ser","name":"SER status","desc":"Open the enclosure and navigate the Cyber Sciences SER drop-downs on the display. Verify there are no status errors, and record any discrepancies."},{"id":"lights","name":"Diagnostic lights","desc":"Open each enclosure and look for any diagnostic light indicators. Record discrepancies."},{"id":"wiring","name":"Wiring","desc":"Open each enclosure and look for missing wire labels or obvious wiring defects. Record discrepancies."},{"id":"labels","name":"Device labeling","desc":"Check for missing labels, for example IP, node and instance number. Record discrepancies."},{"id":"drawings","name":"Drawings","desc":"Confirm the proper drawings are present in the enclosure. Record discrepancies."},{"id":"clean","name":"Cleanliness","desc":"Check for clean enclosures, for example Panduit covers attached, no loose documents or media, free of dirt and debris, and no unused components.","warn":"If covers are off because of poor wiring, do not replace them. If media or unused components are present, do not remove them. Only record."}]};
const KEY="epms_panel_inspection_v1";
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let cur=0;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const get=(p,c)=>(S[p]&&S[p][c])||{r:"",n:""};
function set(p,c,k,v){S[p]=S[p]||{};S[p][c]=S[p][c]||{r:"",n:""};S[p][c][k]=v;save()}
function stats(p){let g=0,b=0,n=0;D.checks.forEach(c=>{const r=get(p,c.id).r;if(r==="good")g++;else if(r==="bad")b++;else if(r==="na")n++});return{g,b,n,done:g+b+n,total:D.checks.length}}
function tabs(){
 $("tabs").innerHTML="";
 D.panels.forEach((p,i)=>{
  const s=stats(p),t=document.createElement("button");
  t.className="tab"+(i===cur?" on":"")+(s.done===s.total?" done":"")+(s.b?" flag":"");
  t.innerHTML=p+"<small>"+s.done+"/"+s.total+(s.b?" · "+s.b+" issue"+(s.b>1?"s":""):"")+"</small>";
  t.onclick=()=>{cur=i;render()};$("tabs").appendChild(t)});
 let tot=0,dn=0;D.panels.forEach(p=>{const s=stats(p);tot+=s.total;dn+=s.done});
 $("bar").style.width=(100*dn/tot)+"%";$("ov").textContent=dn+" of "+tot+" checked"}
function render(){
 tabs();
 const p=D.panels[cur],s=stats(p),v=$("view");v.innerHTML="";
 const h=document.createElement("div");h.className="ph";
 h.innerHTML="<h2>"+p+" EPMS Panel</h2><span>Electrical room "+p+"</span>"+
  (s.g?'<span class="chip g">'+s.g+' good</span>':"")+(s.b?'<span class="chip b">'+s.b+' issue</span>':"")+(s.n?'<span class="chip n">'+s.n+' n/a</span>':"");
 v.appendChild(h);
 const ma=document.createElement("div");ma.className="markall";
 ma.innerHTML='<button>Mark all remaining Good</button>';
 ma.firstChild.onclick=()=>{D.checks.forEach(c=>{if(!get(p,c.id).r)set(p,c.id,"r","good")});render()};
 v.appendChild(ma);
 D.checks.forEach((c,i)=>{
  const st=get(p,c.id),card=document.createElement("div");
  card.className="card"+(st.r?" "+st.r:"")+((st.r==="bad"&&!st.n.trim())?" empty":"");
  card.innerHTML='<div class="top"><div class="num">'+(i+1)+'</div><div class="txt"><h3>'+c.name+'</h3><p>'+c.desc+'</p>'+(c.warn?'<div class="warn"><b>Note:</b> '+c.warn+'</div>':"")+'</div><div class="btns"></div></div>'+
   '<textarea placeholder="Notes (required for an issue)"></textarea><div class="hint">Add a note describing the issue.</div>';
  const bw=card.querySelector(".btns");
  [["g","Good","good"],["b","Issue","bad"],["n","N/A","na"]].forEach(([k,l,val])=>{
   const b=document.createElement("button");b.className="b "+k+(st.r===val?" on":"");b.textContent=l;
   b.onclick=()=>{set(p,c.id,"r",st.r===val?"":val);render()};bw.appendChild(b)});
  const ta=card.querySelector("textarea");ta.value=st.n;
  if(st.r==="bad"&&!st.n.trim())ta.classList.add("need");
  ta.oninput=()=>{set(p,c.id,"n",ta.value);const bad=get(p,c.id).r==="bad";
   card.classList.toggle("empty",bad&&!ta.value.trim());ta.classList.toggle("need",bad&&!ta.value.trim());tabs()};
  v.appendChild(card)});
 const nv=document.createElement("div");nv.className="nav";
 nv.innerHTML='<button class="sec" id="pv">Previous panel</button><button id="nx">Next panel</button>';
 v.appendChild(nv);
 $("pv").disabled=cur===0;$("nx").disabled=cur===D.panels.length-1;
 $("pv").onclick=()=>{cur--;render();scrollTo(0,0)};$("nx").onclick=()=>{cur++;render();scrollTo(0,0)}}
function label(r){return r==="good"?"GOOD":r==="bad"?"ISSUE":r==="na"?"N/A":"NOT CHECKED"}
function report(issuesOnly){
 const L=[];const d=new Date().toLocaleString();
 L.push("EPMS Panel Inspection - "+d);
 D.panels.forEach(p=>{
  const rows=D.checks.map(c=>({c,s:get(p,c.id)})).filter(x=>!issuesOnly||x.s.r==="bad");
  if(!rows.length)return;
  L.push("");L.push(p+" EPMS Panel");
  rows.forEach(x=>L.push("  - "+x.c.name+": "+label(x.s.r)+(x.s.n.trim()?" | "+x.s.n.trim().replace(/\s*\n\s*/g," / "):"")))});
 if(issuesOnly&&L.length===1)L.push("","No issues recorded.");
 return L.join("\n")}
function showSum(){
 let h='<table class="sum"><tr><th>Panel</th><th>Good</th><th>Issues</th><th>N/A</th><th>Left</th></tr>';
 D.panels.forEach(p=>{const s=stats(p);h+="<tr><td><b>"+p+"</b></td><td>"+s.g+"</td><td>"+(s.b?'<b style="color:var(--bad)">'+s.b+"</b>":0)+"</td><td>"+s.n+"</td><td>"+(s.total-s.done)+"</td></tr>"});
 h+="</table><p style='color:var(--muted);font-size:13px'>Preview of the full report:</p><pre>"+report(false).replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</pre>";
 $("sumbody").innerHTML=h;$("dlg").showModal()}
function copy(t,msg){
 const fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");alert(msg)}catch(e){prompt("Copy this:",t)}x.remove()};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>alert(msg),fb)}else fb()}
$("rep").onclick=showSum;$("x").onclick=()=>$("dlg").close();
$("cpA").onclick=()=>copy(report(true),"Issues copied");$("cpB").onclick=()=>copy(report(false),"Full report copied");
$("rst").onclick=()=>{if(confirm("Clear every result and note for all panels?")){S={};save();cur=0;render()}};
render();
</script></body></html>
